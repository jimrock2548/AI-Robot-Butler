# PostgreSQL สำหรับโหมด DB_MODE=pg
#   docker compose up -d
#   pnpm --filter @hermes/backend prisma:migrate
services:
  postgres:
    image: postgres:16
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
