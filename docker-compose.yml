# PostgreSQL สำหรับโหมด DB_MODE=pg
#   docker compose up -d
#   pnpm --filter @hermes/backend prisma:migrate
services:
  postgres:
    image: postgres:16
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: hermes-searxng
    profiles: ["ai"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    restart: unless-stopped

volumes:
  pgdata:
  searxng-cache:
